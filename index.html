<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Private offline-first activity timestamp tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=8">
  <title>Activity Tracker</title>
</head>
<body>
  <section id="authGate" class="auth-gate" hidden>
    <div class="auth-panel">
      <p class="eyebrow">Activity tracker</p>
      <h1>Welcome back</h1>
      <p class="hero">Sign in to keep your records private and synchronized across devices.</p>
      <button class="btn auth-button" data-auth-login>Continue with Google</button>
    </div>
  </section>

  <main id="appMain" class="app" hidden>
    <header class="topbar">
      <div><p class="eyebrow">Activity tracker</p><h1>Record now</h1></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Starting…</span></div>
    </header>
    <p class="hero">One tap records the current time. Everything stays available offline.</p>
    <section class="activities" aria-label="Activities">
      <button class="activity" data-activity="Wash"><strong>Wash</strong><span class="latest" data-latest="Wash">Loading…</span></button>
      <button class="activity" data-activity="Out"><strong>Out</strong><span class="latest" data-latest="Out">Loading…</span></button>
      <button class="activity" data-activity="Reach"><strong>Reach</strong><span class="latest" data-latest="Reach">Loading…</span></button>
      <button class="activity" data-activity="Poop"><strong>Poop</strong><span class="latest" data-latest="Poop">Loading…</span></button>
      <button class="activity" data-activity="OP"><strong>OP</strong><span class="latest" data-latest="OP">Loading…</span></button>
    </section>
    <section class="summary">
      <div class="summary-head"><h2>Today</h2><span class="count" id="todayCount">0 records</span></div>
      <ul class="summary-list" id="summaryList"></ul>
      <div class="summary-actions">
        <button id="syncBtn" class="btn secondary">Sync now</button>
        <button id="resetLocalBtn" class="btn quiet">Reset local data</button>
      </div>
      <div class="account-row"><span id="accountLabel"></span><button id="signOutBtn" class="text-button">Sign out</button></div>
    </section>
  </main>

  <nav id="appNav" class="nav" aria-label="Bottom navigation" hidden>
    <a href="index.html" class="active">●<span>Record</span></a>
    <a href="report.html">▥<span>Reports</span></a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/supabase.js?v=8"></script>
  <script src="config.js?v=8"></script>
  <script src="auth.js?v=8"></script>
  <script src="db.js?v=8"></script>
  <script src="sync.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
